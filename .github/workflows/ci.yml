name: CI

on:
  push:
    branches: [main]
    tags: ["app-v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The manifest gate. Cheap, fast, and the reason `servers.json` is a source of
  # truth rather than a suggestion: without this, a generated copy can drift and
  # nothing anywhere says so, because nothing breaks when a table is wrong.
  #
  # ubuntu on purpose. The check is `node` reading JSON and comparing strings —
  # putting it on a macOS runner would make the fastest signal in the repo wait
  # behind the scarcest queue.
  manifest:
    name: Manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v6
      # `24`, not `lts/*`: the app embeds Node 24 (NODE_VERSION in the Makefile),
      # and `lts/*` moves to the next major every October, which would put CI on
      # a runtime no shipped build has ever run.
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true
          cache: "pnpm"
      - name: Install 🪄
        run: pnpm install --frozen-lockfile
      - name: Lint 🔍
        run: pnpm run lint
      - name: Format 🔍
        run: pnpm run format:check
      - name: Servers drift 🔍
        run: pnpm run servers:check
      # The Worker decides whether a paying customer gets a key, and the script
      # tests assert the Node minter and the Worker produce byte-identical
      # licences against the public key compiled into the app. Both suites
      # existed for a month before anything ran them outside a developer's
      # shell.
      - name: Types (api) 🔍
        run: pnpm --filter @mgcrea/bastion-api typecheck
      - name: Tests 🔍
        run: pnpm test

  # The site build, and the only job that needs Git LFS.
  #
  # Its own job rather than a step in `manifest`, which the comment above calls
  # the fastest signal in the repo — an astro build runs sharp over every
  # screenshot derivative and would put a minute in front of a check that
  # currently answers in seconds.
  #
  # What it is actually gating: `Screens.astro` imports the six captures through
  # astro:assets, so a capture that was never committed, or one committed
  # outside LFS, fails the build here rather than 404ing in production. That is
  # the whole reason the images are imported rather than referenced out of
  # public/.
  website:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
        with:
          # Without this the captures arrive as 131-byte pointer files still
          # named .png, and the failure surfaces inside sharp as a complaint
          # about the image format rather than about the checkout.
          lfs: true
      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v6
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true
          cache: "pnpm"
      - name: Install 🪄
        run: pnpm install --frozen-lockfile
      - name: Types 🔍
        run: pnpm --filter @mgcrea/bastion-website typecheck
      - name: Build 📦
        run: pnpm --filter @mgcrea/bastion-website build

  # Deploys, on main only, once the checks above are green.
  #
  # Both jobs start, then stop at the first step unless CLOUDFLARE_API_TOKEN is
  # set: `secrets` cannot gate a job directly, and a job that fails for want of
  # a secret would keep CI red on every push until somebody added it. Without
  # the secret they are a no-op and the site and the Worker stay hand-deployed
  # with `pnpm deploy` in each app, exactly as before.
  deploy-api:
    name: Deploy api
    needs: [manifest]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Token present? 🔑
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "No CLOUDFLARE_API_TOKEN secret; skipping the deploy."; fi
      - name: Checkout 🛎️
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v5
      - name: Setup pnpm 🔧
        if: steps.token.outputs.present == 'true'
        uses: pnpm/action-setup@v6
      - name: Setup node 🔧
        if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
      - name: Install 🪄
        if: steps.token.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Deploy 🚀
        if: steps.token.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @mgcrea/bastion-api run deploy
      # The one thing a green `wrangler deploy` does not prove is that the
      # Worker answers.
      - name: Health 🩺
        if: steps.token.outputs.present == 'true'
        run: curl -fsS --max-time 20 https://api.bastion.mgcrea.io/health

  deploy-website:
    name: Deploy website
    needs: [manifest, website]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Token present? 🔑
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "No CLOUDFLARE_API_TOKEN secret; skipping the deploy."; fi
      - name: Checkout 🛎️
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v5
        with:
          lfs: true
      - name: Setup pnpm 🔧
        if: steps.token.outputs.present == 'true'
        uses: pnpm/action-setup@v6
      - name: Setup node 🔧
        if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
      - name: Install 🪄
        if: steps.token.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Deploy 🚀
        if: steps.token.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @mgcrea/bastion-website run deploy
      - name: Live 🩺
        if: steps.token.outputs.present == 'true'
        run: curl -fsS --max-time 20 -o /dev/null https://bastion.mgcrea.io/

  app:
    name: App
    runs-on: macos-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v6
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true
      # Before the build, because none of these need one. They compile a file or
      # two with the checks beside them, so they are the fastest real signal in
      # the repo and there is no reason to spend an Xcode build discovering that
      # the dialect translation is broken.
      #
      # `make unit` covers the two files that had no checks and could have: the
      # dual-era translation, and the hand-written HTTP parser that runs before
      # any authentication. `make dialect` is deliberately NOT here — it needs a
      # running app and an installed catalog server, which makes it a
      # developer's check like `make smoke`, not CI's.
      - name: Unit checks 🔍
        run: make unit
      - name: Client wiring 🔍
        run: make wiring-check
      # Beside the two above and for the same reason: no app, no network, no
      # Keychain — the stub in `audit-check.swift` stands in for one — so the
      # signing round trip is as cheap as the parser checks. Worth having in CI
      # rather than left to a developer, because what it holds still is what a
      # signature is computed over: a change there leaves every export verifying
      # on the Mac that made it and nowhere else.
      - name: Audit export signing 🔍
        run: make audit-check
      - name: Build 📦
        run: make app
      # The security claim, checked. This needs no credentials and no profile —
      # it launches the built bundle, reads what it is listening on, and asserts
      # the Origin and Host refusals. `make smoke` is deliberately NOT here: it
      # needs a real Shopify profile, so it is a developer's check, not CI's.
      - name: Audit the listener 🔍
        run: make audit
