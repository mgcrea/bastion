name: CI

on:
  push:
    branches: [main]
    tags: ["app-v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The manifest gate. Cheap, fast, and the reason `servers.json` is a source of
  # truth rather than a suggestion: without this, a generated copy can drift and
  # nothing anywhere says so, because nothing breaks when a table is wrong.
  #
  # ubuntu on purpose. The check is `node` reading JSON and comparing strings —
  # putting it on a macOS runner would make the fastest signal in the repo wait
  # behind the scarcest queue.
  manifest:
    name: Manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v6
      # `24`, not `lts/*`: the app embeds Node 24 (NODE_VERSION in the Makefile),
      # and `lts/*` moves to the next major every October, which would put CI on
      # a runtime no shipped build has ever run.
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true
          cache: "pnpm"
      - name: Install 🪄
        run: pnpm install --frozen-lockfile
      - name: Lint 🔍
        run: pnpm run lint
      - name: Format 🔍
        run: pnpm run format:check
      - name: Servers drift 🔍
        run: pnpm run servers:check
      # The Worker decides whether a paying customer gets a key, and the script
      # tests assert the Node minter and the Worker produce byte-identical
      # licences against the public key compiled into the app. Both suites
      # existed for a month before anything ran them outside a developer's
      # shell.
      - name: Types (api) 🔍
        run: pnpm --filter @mgcrea/bastion-api typecheck
      - name: Tests 🔍
        run: pnpm test

  # The site build, and the only job that needs Git LFS.
  #
  # Its own job rather than a step in `manifest`, which the comment above calls
  # the fastest signal in the repo — an astro build runs sharp over every
  # screenshot derivative and would put a minute in front of a check that
  # currently answers in seconds.
  #
  # What it is actually gating: `Screens.astro` imports the six captures through
  # astro:assets, so a capture that was never committed, or one committed
  # outside LFS, fails the build here rather than 404ing in production. That is
  # the whole reason the images are imported rather than referenced out of
  # public/.
  website:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
        with:
          # Without this the captures arrive as 131-byte pointer files still
          # named .png, and the failure surfaces inside sharp as a complaint
          # about the image format rather than about the checkout.
          lfs: true
      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v6
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true
          cache: "pnpm"
      - name: Install 🪄
        run: pnpm install --frozen-lockfile
      - name: Types 🔍
        run: pnpm --filter @mgcrea/bastion-website typecheck
      - name: Build 📦
        run: pnpm --filter @mgcrea/bastion-website build

  # Deploys, on main only, once the checks above are green.
  #
  # Both jobs start, then stop at the first step unless CLOUDFLARE_API_TOKEN is
  # set: `secrets` cannot gate a job directly, and a job that fails for want of
  # a secret would keep CI red on every push until somebody added it. Without
  # the secret they are a no-op and the site and the Worker stay hand-deployed
  # with `pnpm deploy` in each app, exactly as before.
  deploy-api:
    name: Deploy api
    needs: [manifest]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Token present? 🔑
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "No CLOUDFLARE_API_TOKEN secret; skipping the deploy."; fi
      - name: Checkout 🛎️
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v5
      - name: Setup pnpm 🔧
        if: steps.token.outputs.present == 'true'
        uses: pnpm/action-setup@v6
      - name: Setup node 🔧
        if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
      - name: Install 🪄
        if: steps.token.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Deploy 🚀
        if: steps.token.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @mgcrea/bastion-api run deploy
      # The one thing a green `wrangler deploy` does not prove is that the
      # Worker answers.
      - name: Health 🩺
        if: steps.token.outputs.present == 'true'
        run: curl -fsS --max-time 20 https://api.bastion.mgcrea.io/health

  deploy-website:
    name: Deploy website
    needs: [manifest, website]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Token present? 🔑
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "No CLOUDFLARE_API_TOKEN secret; skipping the deploy."; fi
      - name: Checkout 🛎️
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v5
        with:
          lfs: true
      - name: Setup pnpm 🔧
        if: steps.token.outputs.present == 'true'
        uses: pnpm/action-setup@v6
      - name: Setup node 🔧
        if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
      - name: Install 🪄
        if: steps.token.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Deploy 🚀
        if: steps.token.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @mgcrea/bastion-website run deploy
      - name: Live 🩺
        if: steps.token.outputs.present == 'true'
        run: curl -fsS --max-time 20 -o /dev/null https://bastion.mgcrea.io/

  app:
    name: App
    runs-on: macos-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v6
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true
      # The formatting gate. It lives here rather than beside the oxfmt check in
      # `manifest` for a plain reason: `manifest` runs on ubuntu, and
      # swift-format comes from the Xcode toolchain, so it exists on this runner
      # and nowhere else in this file.
      - name: Format (swift) 🔍
        run: make format-swift-check
      # Before the build, because none of these need one. They compile a file or
      # two with the checks beside them, so they are the fastest real signal in
      # the repo and there is no reason to spend an Xcode build discovering that
      # the dialect translation is broken.
      #
      # `make unit` covers the two files that had no checks and could have: the
      # dual-era translation, and the hand-written HTTP parser that runs before
      # any authentication. `make dialect` is deliberately NOT here — it needs a
      # running app and an installed catalog server, which makes it a
      # developer's check like `make smoke`, not CI's.
      - name: Unit checks 🔍
        run: make unit
      - name: Client wiring 🔍
        run: make wiring-check
      # Beside the two above and for the same reason: no app, no network, no
      # Keychain — the stub in `audit-check.swift` stands in for one — so the
      # signing round trip is as cheap as the parser checks. Worth having in CI
      # rather than left to a developer, because what it holds still is what a
      # signature is computed over: a change there leaves every export verifying
      # on the Mac that made it and nowhere else.
      - name: Audit export signing 🔍
        run: make audit-check
      # Unsigned, because the runner has no Developer ID certificate in its
      # keychain and never will until one is imported from secrets: a signing
      # build dies in `BastionBridge` with `No signing certificate "Mac
      # Development" found ... team ID "75QE9PRT3V"`, which is how this job
      # failed on every run from the day it was written until 1.5.0.
      #
      # This is not a weaker build. `bundle` takes the same two flags before
      # `make sign` signs the staged bundle, so what CI compiles is what a
      # release compiles — minus a signature CI cannot produce and no check
      # below reads.
      - name: Build 📦
        run: make app XCARGS="CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO"
      # The security claim, checked. This needs no credentials and no profile —
      # it launches the built bundle, reads what it is listening on, and asserts
      # the Origin and Host refusals. `make smoke` is deliberately NOT here: it
      # needs a real Shopify profile, so it is a developer's check, not CI's.
      #
      # The flags are repeated rather than inherited: `audit` has `app` as a
      # prerequisite, so without them make rebuilds it signed and fails here
      # instead, one step after the build succeeded.
      - name: Audit the listener 🔍
        run: make audit XCARGS="CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO"

  # The app ships as a Developer ID signed, notarized zip attached to a GitHub
  # release, with a Sparkle appcast beside it — never from the website, whose
  # /download, /checksum and /appcast.xml are 302s to
  # releases/latest/download/<asset>. Bastion is not an App Store app and has no
  # store listing.
  #
  # Until 1.5.0 every one of the steps below was run by hand on a developer's
  # Mac. Cupertino's release-app job is the model this follows, step for step,
  # with three deliberate differences noted where they occur: the checksum
  # format, the release body, and no Homebrew cask.
  release-app:
    name: Release Bastion.app
    runs-on: macos-latest
    needs: [manifest, app]
    if: startsWith(github.ref, 'refs/tags/app-v')
    permissions:
      contents: write
      # attest-build-provenance signs the artifact's provenance, so the zip a
      # user downloads can be traced to the workflow run and commit that built it.
      id-token: write
      attestations: write
    steps:
      # fetch-depth: 0 because CURRENT_PROJECT_VERSION is the commit count. A
      # shallow clone would silently count only what it fetched and produce a
      # build number that moves on every re-run.
      - name: Checkout 🛎️
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v6
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true
      # The tag is authoritative about what ships, and nothing in this repo
      # checks that the four hand-edited copies of the version agree with it —
      # they are four separate edits in the release commit and CI has never seen
      # them. Refuse here, where the fix is a commit and a re-tag, rather than
      # after a notarized zip is public and an appcast names a release that does
      # not match the app inside it.
      #
      # DemoSeed.version is deliberately NOT checked: it is the number the
      # marketing captures show and is allowed to lag, so gating on it would
      # fail a release that is correct.
      - name: Resolve version from tag 🔍
        id: version
        run: |
          version="${GITHUB_REF_NAME#app-v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+].+)?$'; then
            echo "::error::tag ${GITHUB_REF_NAME} does not carry a semver version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          fail=0
          # Both build configurations, because they are edited by hand and one
          # has been missed before.
          marketing=$(grep -c "MARKETING_VERSION = $version;" apps/apple/Bastion.xcodeproj/project.pbxproj || true)
          if [ "$marketing" != "2" ]; then
            echo "::error::project.pbxproj has $marketing of 2 configurations at MARKETING_VERSION = $version"
            fail=1
          fi
          site=$(sed -n 's/^export const APP_VERSION = "\(.*\)";$/\1/p' apps/website/src/config.ts)
          if [ "$site" != "$version" ]; then
            echo "::error::apps/website/src/config.ts says APP_VERSION $site, not $version"
            fail=1
          fi
          # The CHANGELOG is a shipped artifact twice over: `make appcast` puts
          # its first section in the Sparkle feed, and the release body below is
          # the same section as markdown. A stale heading ships the previous
          # release's notes to everyone deciding whether to install.
          head=$(sed -n 's/^## \[\([0-9][^]]*\)\].*/\1/p' CHANGELOG.md | head -1)
          if [ "$head" != "$version" ]; then
            echo "::error::the first CHANGELOG section is [$head], not [$version] — is it still [Unreleased]?"
            fail=1
          fi
          if ! grep -q "\`app-v$version\` being the newest" CHANGELOG.md; then
            echo "::error::the CHANGELOG intro line does not name app-v$version as the newest tag"
            fail=1
          fi
          exit $fail
      # macOS 26 is the deployment target and the appcast's
      # minimumSystemVersion, so a runner image without that SDK fails deep
      # inside xcodebuild with nothing pointing at the cause.
      - name: Check the SDK 🔍
        run: |
          xcodebuild -showsdks | grep -E 'macosx2[6-9]' \
            || { echo "::error::no macOS 26+ SDK on this runner image"; exit 1; }
      - name: Import signing certificate 🔑
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without this, codesign blocks on an interactive keychain prompt that
          # a runner can never answer, and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # `make sign` falls back to an Apple Development certificate with only
          # a warning. That is right on a developer's Mac and wrong here: it
          # would produce a build that cannot notarize, several minutes later
          # and for a reason the notarytool output does not name.
          security find-identity -v -p codesigning | grep -q 'Developer ID Application' \
            || { echo "::error::no Developer ID Application identity after import"; exit 1; }
      - name: Build, sign and notarize 📦
        env:
          AC_KEY_ID: ${{ secrets.AC_KEY_ID }}
          AC_ISSUER_ID: ${{ secrets.AC_ISSUER_ID }}
        run: |
          printf '%s' "${{ secrets.AC_KEY_P8_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/ac.p8"
          export AC_KEY_PATH="$RUNNER_TEMP/ac.p8"
          # Passed explicitly rather than left to the Makefile's own defaults.
          # APP_VERSION there is `git describe`, which resolves to this tag and
          # would be right — but only because the tag exists; naming it here is
          # what makes that a fact rather than a coincidence. CFBundleVersion is
          # the commit count, not github.run_number, so a re-run of the same tag
          # produces the same bytes and the same SHA-256.
          build=$(git rev-list --count HEAD)
          test "$build" -gt 0 2>/dev/null \
            || { echo "::error::could not count commits; is this a shallow clone?"; exit 1; }
          echo "CFBundleVersion=$build (from $(git rev-parse --short HEAD))"
          make build-release \
            XCARGS="MARKETING_VERSION=${{ steps.version.outputs.version }} CURRENT_PROJECT_VERSION=$build"
      # Every claim the download page makes, checked against the artifact that
      # is about to be uploaded rather than against the tree it was built from.
      - name: Verify the artifact 🔍
        run: |
          app="apps/apple/.build/Build/Products/Release/Bastion.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          # As an offline machine sees it: proves the ticket was stapled, not
          # merely that notarization was accepted.
          spctl -a -vvv -t install "$app"
          # The gate the three above cannot be: a correctly signed, stapled
          # bundle whose embedded runtime cannot install or start a server
          # passes every one of them. This spawns a server under the runtime
          # that ships beside it.
          scripts/verify-servers.sh "$app"
          # The update signature is only worth as much as the key the shipped
          # bundle will check it against.
          baked=$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$app/Contents/Info.plist")
          test -n "$baked" || { echo "::error::no SUPublicEDKey in the built bundle"; exit 1; }
          echo "SUPublicEDKey=$baked"
      # DIVERGES from Cupertino, which writes `shasum`'s default output. The
      # website serves /checksum raw, so this file has to be the bare digest:
      # the default would publish "<hash>  Bastion.zip" to anyone piping it into
      # a comparison.
      - name: Checksum 🔢
        working-directory: apps/apple/.build
        run: |
          shasum -a 256 Bastion.zip | cut -d' ' -f1 > Bastion.zip.sha256
          test "$(wc -c < Bastion.zip.sha256)" -eq 65 \
            || { echo "::error::Bastion.zip.sha256 is not a bare 64-char digest"; exit 1; }
          cat Bastion.zip.sha256
      # After the checksum, and that ordering is load-bearing: `make notarize`
      # re-creates Bastion.zip once the ticket is stapled, so both must run
      # after it and describe the same bytes. A signature made any earlier would
      # be valid over an archive carrying no ticket — Sparkle would accept the
      # download and Gatekeeper would refuse it on first launch.
      - name: Sign the update 🔏
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: make appcast
      - name: Attest provenance 🔏
        uses: actions/attest-build-provenance@v3
        with:
          # The feed too: it names the bytes Sparkle will install, so it is part
          # of what a user ends up trusting.
          subject-path: |
            apps/apple/.build/Bastion.zip
            apps/apple/.build/appcast.xml
      # DIVERGES from Cupertino's generate_release_notes. The body is the top
      # CHANGELOG section verbatim, which is the same text the appcast renders
      # to HTML — the two are one release described once. Generated notes would
      # replace a curated summary with a list of commit subjects.
      - name: Release notes 📝
        run: awk '/^## /{ if (n++) exit } n' CHANGELOG.md | tail -n +2 > "$RUNNER_TEMP/notes.md"
      # The asset names carry no version on purpose: that is what makes
      # /releases/latest/download/<asset> a permanent URL, which all three
      # website redirects point at. The version lives in the tag.
      - name: Release 🚀
        uses: softprops/action-gh-release@v2
        with:
          name: Bastion ${{ steps.version.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md
          make_latest: true
          files: |
            apps/apple/.build/Bastion.zip
            apps/apple/.build/Bastion.zip.sha256
            apps/apple/.build/appcast.xml
      # No Homebrew cask step, unlike Cupertino: Bastion has no tap and no
      # packaging/homebrew template to render. If one is ever added, the guard
      # belongs in the shell and NOT in `if:` — the secrets context is not
      # available to a step-level condition, and referencing it there fails the
      # whole workflow at startup rather than skipping the step.
      - name: Clean up secrets 🧹
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/ac.p8" "$RUNNER_TEMP/cert.p12"
