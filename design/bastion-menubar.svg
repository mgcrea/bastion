<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="18" height="18">
  <title>Bastion — menu bar template, idle</title>
  <!-- The fort on its ridge. `bastion-menubar-active.svg` is this file plus the
       curtain wall, shown while a server is running — read that file's note
       before moving anything here, because the fort and the ridge must be
       identical in the two or the mark visibly twitches when a server starts.

       Pure black plus alpha: AppKit tints a template image itself, for light
       menu bars, dark ones and the highlighted state, so there is one file
       rather than three renderings.

       Coordinates are cupertino's 36-unit grid at 18pt, so 2 units = 1pt — the
       same grid, so the menu bar glyphs in this family are comparable without
       conversion.

       THE RIDGE IS BASTION'S OWN, and it is not cupertino's. That is the first
       thing to know before copying anything across: cupertino's back hill is an
       S-wave, crest left and trough right, while `bastion-mark.svg` draws a
       SYMMETRIC DOME with its crest dead centre and no trough —

         M-39.7 882.8 Q512 609.1 1063.7 882.8   crest at 50.0% across,
                                                amplitude 0.1240 of span

       This is that curve. Only the amplitude is dialled down: 2.2 units against
       the 3.60 a proportional transcription would give, which is the same 61%
       restraint cupertino's hill carries. Keep the shape and move the amplitude
       alone. The two apps sharing a construction while keeping their own ridges
       is the point — a shared hill would make one of them wrong.

       THE FORT STANDS ON THE RIDGE, IT DOES NOT SET BEHIND IT. In the icon the
       fort is drawn *after* the hills, so it is in front of them; cupertino's
       sun is drawn *before*, so it sets behind. That difference decides the
       construction here, and it was measured rather than argued: drawn
       faithfully, with the fort's flat base overlapping the ridge, the two weld
       into a single connected component at every size and the ridge reads as
       feet sticking out sideways. In a one-colour template, "in front of" and
       "merged with" are the same picture.

       So the fort's flat base rests exactly ON the sky line — y25.30, the clip's
       height at the centre — rather than below it. The fort is never actually
       cut; it keeps the closed base it needs for a floor, and the ridge sits
       under it with 1.05pt of sky between. Cutting it, cupertino-style, also
       measures fine and was drawn; it was rejected because a fort that sets
       behind a hill is cupertino's idea, not this one's.

       THE CLIP IS A TRUE NORMAL OFFSET — the ridge pushed 3 units along its own
       perpendicular, fitted as one cubic, not shifted vertically. It exists for
       the wall in the active file, whose feet terminate on it; the fort sits
       above it and is untouched. Max deviation from the exact offset is 0.020
       units = 0.010pt, and a normal offset can cusp only if it exceeds the
       curve's radius of curvature, which is 47.78 units here against a 3-unit
       offset.

       SKY. Because the offset is perpendicular, the gap between the sky line and
       the top of the ridge's stroke is exactly 3 − 0.9 = 2.1 units = 1.05pt at
       every point, at any amplitude — the same figure cupertino's glyph holds.
       Resize the ridge or the fort freely; leave the 3 and the 1.8 alone.

       SIZE. The fort is 19.38 units wide and it was 20.39. The old width was
       fitted on ink alone — 22.4% of the tile against cupertino's 22.5% — and
       that fit is what the change cost: 20.7% now, 8% lighter than cupertino in
       the same bar. It bought the ridge. At 20.39 the wall in the active file
       came down within 0.35 units of the ridge's own ends, so the hill finished
       where the wall finished and read as a ridge cut to fit the glyph rather
       than as ground the fort stands on. At 19.38 the ridge runs 0.90 units past
       the wall on each side, which is the same reading cupertino gets from 1.20.
       Ink was the only thing that moved with the fort: the gap, both strokes,
       the sky and the component counts all hold.

       SEAT. What lands on cupertino's line is the ink MASS, not the bounding
       box: 21.33 against 21.22 idle, 19.74 against 19.87 active. Mass rather
       than box, because the fort is a solid shape above a 0.9pt line and the eye
       follows the fort. Shrinking the fort alone would have dropped that mass by
       0.4 — its base is pinned to the sky line, so only the fort moved — so the
       ridge, the clip and the fort were all LIFTED 0.4 to put it back. That lift
       is the only reason the coordinates here differ from the old ones by
       anything but the scale, and being a pure translation it leaves the clip a
       true normal offset of the ridge.

       Those figures come from one measuring pass over real renders — geometry
       off a 720px rasterisation, alpha thresholded at 32 — with cupertino's
       glyphs measured in the same pass. That is why its numbers here sit a
       little off the ones this file used to quote; nothing in cupertino moved.

       Re-measure with a connected-component count on a real render after any
       edit, never by eye. Idle is two components and active is three, holding
       at 16, 18 and 20pt. -->
  <defs>
    <clipPath id="sky">
      <path d="M-4 -4 L40 -4 L40 27.63 L33.37 27.63 C23.22 24.55 12.78 24.55 2.63 27.63
               L-4 27.63 Z" />
    </clipPath>
  </defs>
  <g clip-path="url(#sky)">
    <path d="M18 9.81 L26.24 16.59 L27.69 25.3 L8.31 25.3 L9.76 16.59 Z" fill="#000" />
  </g>
  <path d="M3.5 30.5 Q18 26.1 32.5 30.5" fill="none" stroke="#000" stroke-width="1.8"
    stroke-linecap="round" />
</svg>
