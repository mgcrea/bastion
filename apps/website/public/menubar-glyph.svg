<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="18" height="18">
  <title>Bastion — menu bar template</title>
  <!-- Direction 4a's own menu bar glyph, transcribed from the 15px chip in
       `.idea/design/Bastion Logo v2.dc.html`: the curtain wall closed at the
       base, with the solid spur inside it. Same subject as the app icon, so the
       menu bar and the Dock read as one app.

       Two details are easy to get wrong by taking the geometry from the icon
       mark or the site mock instead of from 4a itself, and both matter here:

       The wall is CLOSED. The icon leaves it open at the base so the outline
       runs into the hills; there are no hills at 18pt, and an open wall leaves
       the silhouette with no floor — the two legs and the spur merge into one
       mass at 1x. The closed base is what gives it a bottom edge to read
       against.

       The stroke is the canvas's own 6 units in its 64-unit box, which lands at
       3.17 here (1.58pt) — NOT the 5 the lockup beside it uses. It was checked
       rather than assumed: rendered at 18pt against 2.8 and 2.5, the counter
       between the wall and the spur survives at all three, so the canvas weight
       carries no cost and there is nothing to tune. Re-render at 1x after any
       change; that is where this fails first, and it is invisible at 2x.

       Pure black plus alpha: AppKit tints a template image itself, for light
       menu bars, dark ones and the highlighted state, so there is one file
       rather than three renderings.

       Coordinates are cupertino's 36-unit grid at 18pt, so 2 units = 1pt — the
       same grid, so the two menu bar glyphs in this family are comparable
       without conversion. The 64-unit source is scaled so the ink spans 32.2
       units vertically, cupertino's constraining dimension.

       The two shapes carry two weights on purpose — one light (the stroked
       wall), one solid (the spur) — for the reason cupertino's three do:
       matched weights read as tramlines rather than as one form inside
       another. -->
  <g fill="none" stroke="#000" stroke-linejoin="round">
    <path d="M18 3.48 L31.99 15.62 L28.82 32.52 L7.18 32.52 L4.01 15.62 Z" stroke-width="3.17" />
    <path d="M18 12.19 L24.86 18.53 L26.45 26.45 L9.55 26.45 L11.14 18.53 Z" fill="#000" stroke="none" />
  </g>
</svg>
