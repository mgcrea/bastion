<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="18" height="18">
  <title>Bastion — menu bar template, idle</title>
  <!-- The fort alone. `bastion-menubar-active.svg` is this file plus the
       curtain wall, shown while a server is running — read that file's note
       before moving anything here, because the fort must be identical in the
       two or the mark visibly twitches when a server starts.

       This is the app icon's subject with nothing added, and the shape is
       `bastion-mark.svg`'s own fort rather than a second drawing of it: the
       icon dropped its wall too, so the Dock and an idle menu bar are now the
       same silhouette. The wall is no longer part of the mark. It is what the
       mark does when it is guarding something.

       The glyph is still authored rather than composed, because the sizing
       below is a menu bar problem the 1024 mark knows nothing about. What is
       no longer authored is the *shape* — the five vertices are the mark's,
       scaled, and the two used to differ by about 5% in aspect for no reason
       anybody had written down.

       Pure black plus alpha: AppKit tints a template image itself, for light
       menu bars, dark ones and the highlighted state, so there is one file
       rather than three renderings.

       Coordinates are cupertino's 36-unit grid at 18pt, so 2 units = 1pt — the
       same grid, so the menu bar glyphs in this family are comparable without
       conversion.

       SIZE. The fort is 22.67 units wide, which is not a drawing decision: it
       is the widest fort the *active* glyph can carry while keeping a 2-unit
       margin, because the wall standing off it eats 8.8 units of the width
       budget. Measured at 18pt, the two states come out 23.0 x 18.2 and
       31.5 x 24.8, against cupertino's own 34.0 x 16.8 and 34.0 x 20.8 —
       siblings, rather than one glyph carrying twice the mass of the other,
       which is what the old 31.5 x 32.5 double pentagon was.

       SITTING IT DOWN. The fort is drawn 1.18 units below the canvas centre.
       That is the same compromise cupertino makes and for the same reason: the
       wall adds 5.6 units above the fort and 0.5 below, so no one position
       centres both states. This one splits the error exactly — idle sits 1.12
       low, active 1.12 high — and it has to change in both files or in neither.

       Re-measure with a connected-component count on a real render after any
       edit, never by eye. At 1x the failure is the wall welding to the fort,
       and it is invisible at the 2x you will be looking at. -->
  <path d="M18 10.11 L27.63 18.05 L29.34 28.25 L6.66 28.25 L8.37 18.05 Z" fill="#000" />
</svg>
