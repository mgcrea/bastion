<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="18" height="18">
  <title>Bastion — menu bar template</title>
  <!-- The mark reduced to its two shapes: the stroked curtain wall, open at the
       base, and the solid spur inside it. No hills — the icon is a scene, this
       is a glyph, and a ridge at 18pt is one more thing to merge into.

       Pure black plus alpha: AppKit tints a template image itself, for light
       menu bars, dark ones and the highlighted state, so there is one file
       rather than three renderings.

       Coordinates are cupertino's 36-unit grid at 18pt, so 2 units = 1pt — the
       same grid, so the two menu bar glyphs in this family are comparable
       without conversion. The geometry is the design canvas's own 64-unit
       lockup glyph, fitted rather than merely scaled: ink height is matched to
       cupertino's constraining dimension (32.2 units = 16.1pt), which lands the
       width at 31.14 and leaves a 2.44-unit gutter on each side.

       The two shapes carry two weights on purpose — one light (the stroked
       wall), one solid (the spur) — for the reason cupertino's three do: matched
       weights read as tramlines rather than as one form inside another.

       The stroke is 2.68 units (1.34pt), picked by rendering 2.68, 3.17 and 3.64
       at 18pt and looking at the counter between the wall and the spur. It
       closes at 3.64 and survives at 2.68. It still narrows at 1x and opens at
       2x, which is the same baseline cupertino's ridges measure; re-render at
       both after any change rather than judging it at 2x. -->
  <g fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 32.76 L3.78 15.58 L18 3.24 L32.22 15.58 L29 32.76" stroke-width="2.68"/>
    <path d="M18 12.1 L24.98 18.54 L26.59 26.59 L9.41 26.59 L11.02 18.54 Z" fill="#000" stroke="none"/>
  </g>
</svg>
